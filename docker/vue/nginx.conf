user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    # include /etc/nginx/conf.d/*.conf;

    server {
        listen       19090;
        charset utf-8;
        server_name  s1;# 服务器地址或绑定域名



        # start ---------------------------------------------------------------------------------------------

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
        location = /index.html {
            root   /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }
        location /api/ {
            client_max_body_size 50g;
            proxy_pass http://java:19141/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /dataset {
            alias   /data/dataset;

            charset utf-8;
            autoindex on;               # enable directory listing output
            autoindex_exact_size off;   # output file sizes rounded to kilobytes, megabytes, and  gigabytes
            autoindex_localtime on;     # output local times in the directory

        }
        location /files/ {
            proxy_pass http://java:19141/files/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
#        location /lua {
#            set_by_lua_file $url /etc/nginx/proxy.lua;
#            proxy_pass  $url;
#            content_by_lua_file /etc/nginx/proxy.lua;
#
#        }


        # end ---------------------------------------------------------------------------------------------

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }

    server {
        listen 19443 ssl;
        server_name _;
        ssl_certificate /etc/xkp/agent-tls/server.crt;
        ssl_certificate_key /etc/xkp/agent-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /_protected/image-archives/ {
            internal;
            alias /data/registry-staging/;
            sendfile on;
        }

        location ~ ^/agent/v1/image-deployments/[^/]+/archive$ {
            proxy_pass http://java:19141;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 4h;
            proxy_send_timeout 4h;
            send_timeout 4h;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /agent/v1/ {
            client_max_body_size 1m;
            proxy_pass http://java:19141/agent/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        location /files/ {
            proxy_pass http://java:19141/files/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
