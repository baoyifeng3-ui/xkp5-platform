services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MATCH_DB_NAME:-match}
    volumes:
      - match_prod_mysql:/var/lib/mysql
    ports:
      - "${MATCH_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  fastdfs-tracker:
    image: delron/fastdfs:latest
    platform: linux/amd64
    restart: unless-stopped
    hostname: fastdfs-tracker
    command: tracker
    volumes:
      - ./fastdfs/tracker_data:/var/fdfs
    ports:
      - "22122:22122"

  fastdfs-storage:
    image: delron/fastdfs:latest
    platform: linux/amd64
    restart: unless-stopped
    hostname: fastdfs-storage
    command: storage
    environment:
      TRACKER_SERVER: fastdfs-tracker:22122
      GROUP_NAME: group1
    volumes:
      - ./fastdfs/storage_data:/var/fdfs
    ports:
      - "23000:23000"
      - "8888:8888"
    depends_on:
      - fastdfs-tracker

  java:
    image: match-v2_java:latest
    build:
      context: .
      dockerfile: docker/java/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      MATCH_BACKEND_PORT: 19141
      MATCH_DB_HOST: mysql
      MATCH_DB_PORT: 3306
      MATCH_DB_NAME: ${MATCH_DB_NAME:-match}
      MATCH_DB_USER: ${MATCH_DB_USER:-root}
      MATCH_DB_PASSWORD: ${MATCH_DB_PASSWORD:?Set MATCH_DB_PASSWORD}
      MATCH_PARTICIPANT_LOGIN_GATE_ENABLED: ${MATCH_PARTICIPANT_LOGIN_GATE_ENABLED:-true}
      MATCH_FASTDFS_TRACKER: fastdfs-tracker:22122
      MATCH_FASTDFS_HTTP: http://fastdfs-storage:8888/
      MATCH_ALLOWED_ORIGINS: ${MATCH_ALLOWED_ORIGINS:-http://localhost:19140,http://127.0.0.1:19140,http://172.16.33.154:19140,http://172.16.33.158:19140}
      MATCH_DATASET_ROOT: /data/dataset
      MATCH_SCORING_SCRIPT: /app/python/evaluation_score.py
      MATCH_SCORING_ANNOTATIONS_ROOT: /data/scoring
      XKP_LICENSE_PUBLIC_KEYS: ${XKP_LICENSE_PUBLIC_KEYS:?Set production license public keys}
      XKP_HOST_IDENTITY_FILE: /etc/xkp/host-identity.json
    volumes:
      - ./download/dataset:/data/dataset
      - ./python:/data/scoring
      - /etc/xkp/host-identity.json:/etc/xkp/host-identity.json:ro
    ports:
      - "${MATCH_BACKEND_PORT:-19141}:19141"
    depends_on:
      mysql:
        condition: service_healthy
      fastdfs-storage:
        condition: service_started

  vue:
    image: match-v2_vue:latest
    build:
      context: .
      dockerfile: docker/vue/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${MATCH_FRONTEND_PORT:-19140}:19090"
      - "${XKP_AGENT_PORT:-19443}:19443"
    volumes:
      - ./download/dataset:/data/dataset:ro
      - ${XKP_AGENT_TLS_DIR:-/etc/xkp/agent-tls}:/etc/xkp/agent-tls:ro
    depends_on:
      - java

volumes:
  match_prod_mysql:
