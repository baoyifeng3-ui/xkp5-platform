name: match-v2

services:
  registry:
    image: ${MATCH_REGISTRY_IMAGE:-${XKP_REGISTRY_IMAGE:-registry:2}}
    pull_policy: never
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_TLS_CERTIFICATE: /etc/xkp/registry-tls/tls.crt
      REGISTRY_HTTP_TLS_KEY: /etc/xkp/registry-tls/tls.key
      REGISTRY_STORAGE_DELETE_ENABLED: ${XKP_REGISTRY_DELETE_ENABLED:-false}
    expose:
      - "5000"
    volumes:
      - registry_data:/var/lib/registry
      - ${XKP_REGISTRY_TLS_DIR:-/etc/xkp/registry-tls}:/etc/xkp/registry-tls:ro

  registry-importer:
    image: ${MATCH_REGISTRY_IMPORTER_IMAGE:-${XKP_REGISTRY_IMPORTER_IMAGE:-xkp5/registry-importer:latest}}
    pull_policy: never
    restart: unless-stopped
    environment:
      REGISTRY_URL: https://registry:5000
      REGISTRY_CA_FILE: /etc/xkp/registry-tls/ca.crt
      REGISTRY_USERNAME_FILE: /run/xkp/registry-secrets/username
      REGISTRY_PASSWORD_FILE: /run/xkp/registry-secrets/password
      REGISTRY_STAGING_ROOT: ${XKP_REGISTRY_STAGING_ROOT:-/data/registry-staging}
      REGISTRY_IMPORT_ROOT: ${XKP_REGISTRY_IMPORT_ROOT:-/data/registry-import}
      REGISTRY_MAX_FILE_BYTES: ${XKP_REGISTRY_MAX_FILE_BYTES:-21474836480}
    volumes:
      - ${XKP_REGISTRY_STAGING_DIR:-./runtime/registry/staging}:/data/registry-staging
      - ${XKP_REGISTRY_IMPORT_DIR:-./runtime/registry/import}:/data/registry-import
      - ${XKP_REGISTRY_CA_FILE:-/etc/xkp/registry-tls/ca.crt}:/etc/xkp/registry-tls/ca.crt:ro
      - ${XKP_REGISTRY_IMPORTER_SECRETS_DIR:-/etc/xkp/registry-secrets}:/run/xkp/registry-secrets:ro
    depends_on:
      - registry

  mysql:
    image: mysql:8.0
    pull_policy: never
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MATCH_DB_NAME:-match}
    volumes:
      - match_prod_mysql:/var/lib/mysql
    ports:
      - "${MATCH_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  fastdfs-tracker:
    image: delron/fastdfs:latest
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    hostname: fastdfs-tracker
    command: tracker
    volumes:
      - ./runtime/fastdfs/tracker_data:/var/fdfs
    ports:
      - "22122:22122"

  fastdfs-storage:
    image: delron/fastdfs:latest
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    hostname: fastdfs-storage
    command: storage
    environment:
      TRACKER_SERVER: fastdfs-tracker:22122
      GROUP_NAME: group1
    volumes:
      - ./runtime/fastdfs/storage_data:/var/fdfs
    ports:
      - "23000:23000"
      - "8888:8888"
    depends_on:
      - fastdfs-tracker

  java:
    image: match-v2_java:${MATCH_RELEASE_VERSION:?Set MATCH_RELEASE_VERSION}
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      MATCH_BACKEND_PORT: 19141
      MATCH_DB_HOST: mysql
      MATCH_DB_PORT: 3306
      MATCH_DB_NAME: ${MATCH_DB_NAME:-match}
      MATCH_DB_USER: ${MATCH_DB_USER:-root}
      MATCH_DB_PASSWORD: ${MATCH_DB_PASSWORD:?Set MATCH_DB_PASSWORD}
      MATCH_PARTICIPANT_LOGIN_GATE_ENABLED: ${MATCH_PARTICIPANT_LOGIN_GATE_ENABLED:-true}
      MATCH_FASTDFS_TRACKER: fastdfs-tracker:22122
      MATCH_FASTDFS_HTTP: http://fastdfs-storage:8888/
      MATCH_ALLOWED_ORIGINS: ${MATCH_ALLOWED_ORIGINS:?Set MATCH_ALLOWED_ORIGINS}
      TERMINAL_AGENT_RELAY_URL: ${TERMINAL_AGENT_RELAY_URL:?Set externally reachable terminal Agent relay URL}
      MATCH_DATASET_ROOT: /data/dataset
      MATCH_SCORING_SCRIPT: /app/python/evaluation_score.py
      MATCH_SCORING_ANNOTATIONS_ROOT: /data/scoring
      XKP_REGISTRY_CA_FILE: /etc/xkp/registry-tls/ca.crt
      XKP_LICENSE_PUBLIC_KEYS: ${XKP_LICENSE_PUBLIC_KEYS:?Set production license public keys}
      XKP_HOST_IDENTITY_FILE: /etc/xkp/host-identity.json
    volumes:
      - ./runtime/dataset:/data/dataset
      - ./runtime/scoring:/data/scoring
      - /etc/xkp/host-identity.json:/etc/xkp/host-identity.json:ro
      - ${XKP_REGISTRY_CA_FILE:-/etc/xkp/registry-tls/ca.crt}:/etc/xkp/registry-tls/ca.crt:ro
    ports:
      - "${MATCH_BACKEND_PORT:-19141}:19141"
    depends_on:
      mysql:
        condition: service_healthy
      fastdfs-storage:
        condition: service_started

  vue:
    image: match-v2_vue:${MATCH_RELEASE_VERSION:?Set MATCH_RELEASE_VERSION}
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${MATCH_FRONTEND_PORT:-19140}:19090"
      - "${XKP_AGENT_PORT:-19443}:19443"
    volumes:
      - ./runtime/dataset:/data/dataset:ro
      - ${XKP_AGENT_TLS_DIR:-/etc/xkp/agent-tls}:/etc/xkp/agent-tls:ro
    depends_on:
      - java

volumes:
  match_prod_mysql:
    name: match-v2_mysql_data
  registry_data:
    name: ${XKP_REGISTRY_VOLUME_NAME:-match-v2_registry_data}
