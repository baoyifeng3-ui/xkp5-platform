# Compatibility profile for older Docker commands. Prefer local or prod.
server:
  port: ${MATCH_BACKEND_PORT:19141}

spring:
  datasource:
    url: jdbc:mysql://${MATCH_DB_HOST:localhost}:${MATCH_DB_PORT:3307}/${MATCH_DB_NAME:match}?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MATCH_DB_USER:root}
    password: ${MATCH_DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

fdfs:
  tracker-list:
    - ${MATCH_FASTDFS_TRACKER:localhost:22122}
  web-server-url: ${MATCH_FASTDFS_HTTP:http://localhost:8888/}

match:
  terminal:
    agent-relay-url: ${TERMINAL_AGENT_RELAY_URL:wss://127.0.0.1:19147/terminal/v1/agent}
  participant-login-gate-enabled: ${MATCH_PARTICIPANT_LOGIN_GATE_ENABLED:false}
  dataset-root: ${MATCH_DATASET_ROOT:../../download/dataset}
  scoring:
    python-executable: ${MATCH_PYTHON_EXECUTABLE:python3}
    script: ${MATCH_SCORING_SCRIPT:../../python/evaluation_score.py}
    annotations-root: ${MATCH_SCORING_ANNOTATIONS_ROOT:../../python}
    timeout-seconds: ${MATCH_SCORING_TIMEOUT_SECONDS:30}
