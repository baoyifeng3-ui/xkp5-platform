
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: satoken
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  activity-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      field-strategy: not_empty
      table-underline: true
      db-type: mysql
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
  mapper-locations: classpath:/mapper/*.xml


match:
  admin-user-name: admin
  participant-login-gate-enabled: ${MATCH_PARTICIPANT_LOGIN_GATE_ENABLED:true}
  allowed-origins: ${MATCH_ALLOWED_ORIGINS:http://localhost:19140,http://127.0.0.1:19140,http://127.0.0.1:19146,http://172.16.33.154:19140,http://172.16.33.158:19140}

xkp:
  platform-version: ${XKP_PLATFORM_VERSION:5.1.0}
  agent:
    package-root: ${XKP_AGENT_PACKAGE_ROOT:/opt/xkp-agent-package}
    ca-file: ${XKP_AGENT_CA_FILE:/etc/xkp/agent-tls/ca.crt}
    management-url: ${XKP_AGENT_MANAGEMENT_URL:https://172.16.33.182:19443}
  ssh-bridge:
    url: ${MATCH_SSH_BRIDGE_URL:http://127.0.0.1:19245}
    token: ${MATCH_SSH_BRIDGE_TOKEN:xkp5-development-ssh-bridge}
  code-server:
    root-ca-file: ${XKP_CODE_SERVER_ROOT_CA_FILE:/etc/xkp/code-server-tls/rootCA.pem}
    ca-key-file: ${XKP_CODE_SERVER_CA_KEY_FILE:/etc/xkp/code-server-tls/ca.key}
  license:
    public-keys: ${XKP_LICENSE_PUBLIC_KEYS:}
    test-public-key: ${XKP_LICENSE_TEST_PUBLIC_KEY:}
