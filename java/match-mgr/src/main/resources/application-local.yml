server:
  port: ${MATCH_BACKEND_PORT:19141}

spring:
  datasource:
    url: jdbc:mysql://${MATCH_DB_HOST:localhost}:${MATCH_DB_PORT:3307}/${MATCH_DB_NAME:match}?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MATCH_DB_USER:root}
    password: ${MATCH_DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 50GB
      max-request-size: 50GB

fdfs:
  connect-timeout: 15000
  so-timeout: 600000
  thumb-image:
    height: 1000
    width: 1000
  tracker-list:
    - ${MATCH_FASTDFS_TRACKER:localhost:22122}
  web-server-url: ${MATCH_FASTDFS_HTTP:http://localhost:8888/}

match:
  competition-password-key: ${MATCH_COMPETITION_PASSWORD_KEY:eGtwNS1kZXZlbG9wbWVudC1rZXktMzItYnl0ZXMhISE=}
  ssh-bridge:
    user: ${MATCH_SSH_USER:root}
  terminal:
    agent-relay-url: ${TERMINAL_AGENT_RELAY_URL:wss://127.0.0.1:19147/terminal/v1/agent}
  # 登录不受比赛倒计时限制；比赛模式仅控制登录后的界面和可用功能。
  participant-login-gate-enabled: ${MATCH_PARTICIPANT_LOGIN_GATE_ENABLED:false}
  fastdfs:
    storage-host: ${MATCH_FASTDFS_STORAGE_HOST:fastdfs-storage}
  allowed-origins: ${MATCH_ALLOWED_ORIGINS:http://localhost:19140,http://127.0.0.1:19140,http://127.0.0.1:19146,http://172.16.33.154:19140,http://172.16.33.158:19140}
  dataset-root: ${MATCH_DATASET_ROOT:download/dataset}
  scoring:
    python-executable: ${MATCH_PYTHON_EXECUTABLE:python3}
    script: ${MATCH_SCORING_SCRIPT:python/evaluation_score.py}
    annotations-root: ${MATCH_SCORING_ANNOTATIONS_ROOT:python}
    timeout-seconds: ${MATCH_SCORING_TIMEOUT_SECONDS:30}

xkp:
  registry:
    import:
      enabled: ${XKP_REGISTRY_IMPORT_ENABLED:false}
    staging-dir: ${XKP_REGISTRY_STAGING_ROOT:${java.io.tmpdir}/xkp-registry-staging}
  licensing:
    environment: DEVELOPMENT
    development-identity: ${XKP_DEVELOPMENT_IDENTITY:windows-docker-development}
