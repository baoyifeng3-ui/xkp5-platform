server:
  port: ${MATCH_BACKEND_PORT:19141}

spring:
  datasource:
    url: jdbc:mysql://${MATCH_DB_HOST:mysql}:${MATCH_DB_PORT:3307}/${MATCH_DB_NAME:match}?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MATCH_DB_USER:root}
    password: ${MATCH_DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

fdfs:
  connect-timeout: 15000
  so-timeout: 15000
  thumb-image:
    height: 1000
    width: 1000
  tracker-list:
    - ${MATCH_FASTDFS_TRACKER:fastdfs-tracker:22122}
  web-server-url: ${MATCH_FASTDFS_HTTP:http://fastdfs-storage:8888/}

match:
  terminal:
    agent-relay-url: ${TERMINAL_AGENT_RELAY_URL}
  allowed-origins: ${MATCH_ALLOWED_ORIGINS:http://localhost:19140,http://127.0.0.1:19140,http://172.16.33.154:19140,http://172.16.33.158:19140}
  dataset-root: ${MATCH_DATASET_ROOT:/data/dataset}
  scoring:
    python-executable: ${MATCH_PYTHON_EXECUTABLE:python3}
    script: ${MATCH_SCORING_SCRIPT:/app/python/evaluation_score.py}
    annotations-root: ${MATCH_SCORING_ANNOTATIONS_ROOT:/data/scoring}
    timeout-seconds: ${MATCH_SCORING_TIMEOUT_SECONDS:30}

xkp:
  registry:
    import:
      enabled: ${XKP_REGISTRY_IMPORT_ENABLED:false}
    staging-dir: ${XKP_REGISTRY_STAGING_ROOT:/data/registry-staging}
  licensing:
    environment: PRODUCTION
    host-identity-file: ${XKP_HOST_IDENTITY_FILE:/etc/xkp/host-identity.json}
